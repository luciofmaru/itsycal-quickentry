# Builds Itsycal (with quick entry) from Itsycal-source.zip on one of
# GitHub's Mac machines, so no local Xcode is needed.
#
# Xcode 16.4 is used on purpose: it's the newest Xcode that can still build
# for macOS 10.14 Mojave. Xcode 26 and later can only target macOS 11+.
#
# Runs whenever anything is uploaded or changed in the repository, or
# by hand: Actions tab > "Build Itsycal" > Run workflow. When it finishes,
# download "Itsycal-app" from Artifacts at the bottom of the run's page.

name: Build Itsycal

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/Itsycal
    steps:
      - uses: actions/checkout@v6

      - name: Unpack the source
        working-directory: .
        run: |
          test -f Itsycal-source.zip || { echo "::error::Itsycal-source.zip isn't in the repository. Upload it to the top level."; exit 1; }
          mkdir -p src
          ditto -x -k Itsycal-source.zip src
          ls src/Itsycal

      - name: Use Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Test the quick-entry parser and check the bundle is up to date
        working-directory: src/Itsycal/QuickEntry
        env:
          TZ: America/Los_Angeles
        run: |
          cp ../Itsycal/quickentry.bundle.js "$RUNNER_TEMP/included.js"
          npm ci
          npm test
          npm run build
          cmp -s ../Itsycal/quickentry.bundle.js "$RUNNER_TEMP/included.js" || {
            echo "::error::Itsycal/quickentry.bundle.js is out of date. Run 'npm run build' in QuickEntry."
            exit 1
          }

      - name: Build universal app (Apple silicon + Intel)
        run: |
          cp Local.xcconfig.example Local.xcconfig
          set +e
          xcodebuild \
            -project Itsycal.xcodeproj \
            -target Itsycal \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1
          status=$?
          # Show just the errors and the result; the full log is kept on failure.
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$GITHUB_WORKSPACE/xcodebuild.log"
          exit $status

      - name: Check the app will run on Mojave
        run: |
          APP=build/Release/Itsycal.app
          BIN="$APP/Contents/MacOS/Itsycal"
          echo "Architectures: $(lipo -archs "$BIN")"
          echo "Minimum macOS (Info.plist): $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          vtool -arch x86_64 -show-build "$BIN" | grep -E "minos|version" || true
          lipo -archs "$BIN" | grep -q x86_64 || { echo "::error::No Intel slice"; exit 1; }
          lipo -archs "$BIN" | grep -q arm64  || { echo "::error::No Apple silicon slice"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = "10.14"
          test -f "$APP/Contents/Resources/quickentry.bundle.js" || { echo "::error::quickentry.bundle.js missing from the app"; exit 1; }
          codesign --verify --deep --verbose=2 "$APP"

      - name: Zip the app
        run: ditto -c -k --keepParent build/Release/Itsycal.app "$GITHUB_WORKSPACE/Itsycal.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: Itsycal-app
          path: Itsycal.zip
          retention-days: 30

      - name: Keep the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
